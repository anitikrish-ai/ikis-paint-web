  try {
    const text = await file.text();
    await loadProjectData(JSON.parse(text));
  } catch {
    alert('Invalid project file.');
  }
  e.target.value = '';
};

$('#file-import').onchange = e => {
  [...e.target.files].forEach(file => {
    const img = new Image();
    img.onload = () => {
      executeStructureOp(() => {
        const l = createLayer(file.name.slice(0, 20) || 'Import');
        const scale = Math.min(1, W / img.width, H / img.height);
        const dw = img.width * scale, dh = img.height * scale;
        getCtx(l.c).drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
        layers.splice(curLayerIdx + 1, 0, l);
        curLayerIdx++;
      });
      URL.revokeObjectURL(img.src);
      showToast('Image Imported');
    };
    img.src = URL.createObjectURL(file);
  });
  e.target.value = '';
};

// Layer Operations
$('#btn-layer-add').onclick = () => executeStructureOp(() => {
  layers.splice(curLayerIdx + 1, 0, createLayer());
  curLayerIdx++;
});
$('#btn-layer-dup').onclick = () => executeStructureOp(() => {
  const src = layers[curLayerIdx];
  const dup = createLayer(src.name + ' copy');
  dup.c = cloneCanvas(src.c);
  Object.assign(dup, { op: src.op, bl: src.bl, clip: src.clip, al: src.al });
  layers.splice(curLayerIdx + 1, 0, dup);
  curLayerIdx++;
});
$('#btn-layer-merge').onclick = () => {
  if (curLayerIdx < 1) { showToast('No layer below'); return; }
  executeStructureOp(() => {
    const bottom = layers[curLayerIdx - 1];
    const top = layers[curLayerIdx];
    const bCtx = getCtx(bottom.c);
    bCtx.globalAlpha = top.op;
    bCtx.globalCompositeOperation = top.bl;
    bCtx.drawImage(top.c, 0, 0);
    layers.splice(curLayerIdx, 1);
    curLayerIdx--;
  });
};
$('#btn-layer-del').onclick = () => {
  if (layers.length <= 1) { showToast('Must have at least one layer'); return; }
  executeStructureOp(() => {
    layers.splice(curLayerIdx, 1);
    curLayerIdx = Math.max(0, curLayerIdx - 1);
  });
};
$('#btn-layer-clip').onclick = () => executeStructureOp(() => {
  layers[curLayerIdx].clip = !layers[curLayerIdx].clip;
});
$('#btn-layer-alock').onclick = () => executeStructureOp(() => {
  layers[curLayerIdx].al = !layers[curLayerIdx].al;
});
$('#layer-opacity').oninput = e => {
  layers[curLayerIdx].op = +e.target.value / 100;
  $('#layer-opacity-val').textContent = e.target.value + '%';
  scheduleRender();
};
$('#layer-opacity').onchange = () => executeStructureOp(() => {});
$('#layer-blend').onchange = e => executeStructureOp(() => {
  layers[curLayerIdx].bl = BLEND_MODES[e.target.value] || 'source-over';
});

// Dynamic Pointer Optical Reflection Tracking
addEventListener('pointermove', e => {
  const nx = (e.clientX / window.innerWidth) - 0.5;
  const ny = (e.clientY / window.innerHeight) - 0.5;
  document.documentElement.style.setProperty('--light-x', `${(-nx * 3.5).toFixed(2)}px`);
  document.documentElement.style.setProperty('--light-y', `${(-ny * 3.5).toFixed(2)}px`);
}, { passive: true });

// Keyboard Hotkeys
addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range') return;
  const k = e.key.toLowerCase();
  const ctrl = e.ctrlKey || e.metaKey;

  if (k === ' ') { spaceHeld = true; stageElem.style.cursor = 'grab'; e.preventDefault(); return; }
  if (ctrl && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (ctrl && k === 'y') { e.preventDefault(); redo(); return; }
  if (ctrl && k === 's') { e.preventDefault(); $('#btn-save').click(); return; }
  if (ctrl && k === 'o') { e.preventDefault(); $('#btn-open').click(); return; }
  if (ctrl && k === 'n') { e.preventDefault(); $('#btn-new').click(); return; }
  if (ctrl && k === 'a') { e.preventDefault(); sel = { x: 0, y: 0, w: W, h: H }; drawOverlay(); return; }
  if (ctrl && k === 'd') { e.preventDefault(); sel = null; drawOverlay(); return; }
  if (k === 'delete' || k === 'backspace') { $('#btn-clear').click(); return; }
if (k === 'f' && !e.metaKey && !e.ctrlKey && !e.altKey) { $('#btn-focus').click(); return; }
  if (k === '[') {
    $('#brush-size').value = Math.max(1, brush.size - 2);
    $('#brush-size').dispatchEvent(new Event('input'));
    return;
  }
  if (k === ']') {
    $('#brush-size').value = Math.min(250, brush.size + 2);
    $('#brush-size').dispatchEvent(new Event('input'));
    return;
  }
  if (k === 'x') { $('#btn-swap-colors').click(); return; }

  const keyMap = { b: 'brush', p: 'pencil', e: 'eraser', a: 'spray', s: 'smudge', g: 'fill', i: 'pick', u: 'rect', d: 'grad', t: 'text', m: 'select', v: 'move', h: 'hand' };
  if (keyMap[k] && !ctrl) setTool(keyMap[k]);
});

addEventListener('keyup', e => {
  if (e.key === ' ') { spaceHeld = false; stageElem.style.cursor = tool === 'hand' ? 'grab' : 'crosshair'; }
});

// Boot Initialization
(async () => {
  setForegroundColor('#1b1b1b', false);
  setBackgroundColor('#ffffff');
  setTool('brush');
  $('#brush-selector').value = 'Dip Pen';

  let loaded = false;
  const saved = await openIndexedDB('get');
  if (saved) {
    try {
      await loadProjectData(JSON.parse(saved));
      loaded = true;
    } catch {}
  }

  // Pure White Canvas Paper Initialized
  if (!loaded) {
    initNewDocument(1920, 1080, '#ffffff');
  }

  fitToStage();
  updateUI();

  window.addEventListener('resize', fitToStage);
})();
</script>

<!-- Vaso core is mounted onto the editor's existing functional surfaces. The editor remains
     dependency-free while the engine provides real refraction, dispersion, depth, and fallback copies. -->
<script type="module">
  import { createGlass, createGlassGroup } from 'https://esm.sh/vaso@1.1.1/core';

  const glassOptions = {
    depth: 1.15,
    blur: 0.12,
    dispersion: 0.62,
    specular: 0.65,
    light: 'pointer',
    pressable: true,
    ripple: true,
  };

  function mountVasoGlass() {
    const topIsland = document.querySelector('#top-island');
    const toolCapsule = document.querySelector('#tools-capsule');
    const studioIsland = document.querySelector('#studio-island');
    const hud = document.querySelector('#hud-pill');
    const restore = document.querySelector('#studio-toggle-btn');

    if (!topIsland || !toolCapsule || !studioIsland) return;

    const topGroup = createGlassGroup(topIsland, {
      smooth: 0.7,
      depth: 0.95,
      blur: 0.16,
      dispersion: 0.46,
      specular: 0.6,
      light: 'pointer',
      overflow: 'visible',
    });

    topIsland.querySelectorAll('.vaso-btn').forEach((button) => {
      topGroup.add(button, { radius: 999, outset: 2 });
    });

    const mounted = [
      [toolCapsule, { ...glassOptions, depth: 1.05, blur: 0.45, dispersion: 0.22 }],
      [studioIsland, { ...glassOptions, depth: 0.35, blur: 0.8, dispersion: false, pressable: false, ripple: false }],
      [hud, { ...glassOptions, depth: 0.35, blur: 0.55, dispersion: false, pressable: false, ripple: false }],
      [restore, { ...glassOptions, depth: 0.9, blur: 0.6, dispersion: 0.25 }],
    ];

    const glasses = mounted
      .filter(([element]) => element)
      .map(([element, options]) => createGlass(element, options));

    window.addEventListener('beforeunload', () => {
      topGroup.destroy();
      glasses.forEach((glass) => glass.destroy());
    }, { once: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountVasoGlass, { once: true });
  } else {
    mountVasoGlass();
  }
</script>
