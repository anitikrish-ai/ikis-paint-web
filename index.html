<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Inkboard – Web Paint</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--bg:#14161c;--g:rgba(40,44,58,.62);--b:rgba(255,255,255,.14);--t:#e8eaf2;--a:#5b8cff}
@media(prefers-color-scheme:light){:root{--bg:#dfe3ee;--g:rgba(255,255,255,.65);--b:rgba(0,0,0,.12);--t:#1b1e28}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:13px system-ui,sans-serif;color:var(--t);background:radial-gradient(circle at 20% 20%,#3a4fa0 0,transparent 45%),radial-gradient(circle at 80% 70%,#a04a8a 0,transparent 40%),var(--bg);overflow:hidden;display:grid;grid-template:48px 1fr/72px 1fr 260px;gap:8px;padding:8px;padding-top:max(8px,env(safe-area-inset-top))}
.glass{background:var(--g);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--b);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 24px rgba(0,0,0,.25)}
header{grid-column:1/4;display:flex;gap:4px;align-items:center;padding:0 8px;overflow-x:auto}
button,select,input{font:inherit;color:inherit}
button{background:rgba(255,255,255,.08);border:1px solid var(--b);border-radius:10px;padding:5px 9px;cursor:pointer;white-space:nowrap}
button:hover{background:rgba(255,255,255,.18)}button.on{background:var(--a);color:#fff;border-color:transparent}button:disabled{opacity:.4}
select,input[type=text],input[type=number]{background:rgba(0,0,0,.25);border:1px solid var(--b);border-radius:8px;padding:4px}
.sep{width:1px;height:24px;background:var(--b);margin:0 4px}
#tools{display:flex;flex-direction:column;gap:4px;padding:6px;overflow-y:auto}#tools button{padding:7px 2px}
#stage{position:relative;overflow:hidden;border-radius:16px;touch-action:none;cursor:crosshair;background:rgba(0,0,0,.25)}
#wrap{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 8px 40px rgba(0,0,0,.5);background:repeating-conic-gradient(#bbb 0 25%,#eee 0 50%) 0 0/16px 16px}
#wrap canvas{position:absolute;left:0;top:0;width:100%;height:100%}
aside{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
aside h4{margin:4px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.row{display:flex;gap:6px;align-items:center}.row>*{min-width:0}.row input[type=range]{flex:1}
#sv{width:100%;height:120px;border-radius:10px;cursor:crosshair;touch-action:none}
#hue{width:100%}#hist,#pal{display:flex;gap:3px;flex-wrap:wrap}
.sw{width:18px;height:18px;border-radius:5px;border:1px solid var(--b);cursor:pointer}
#layers{display:flex;flex-direction:column;gap:3px}
.ly{display:flex;gap:5px;align-items:center;padding:3px;border-radius:9px;border:1px solid transparent;background:rgba(255,255,255,.05)}
.ly.cur{border-color:var(--a);background:rgba(91,140,255,.2)}.ly canvas{width:40px;height:28px;border-radius:4px;background:repeating-conic-gradient(#999 0 25%,#ddd 0 50%) 0 0/8px 8px}
.ly span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ly button{padding:2px 6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:9}
#box{width:min(380px,92vw);padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--g)}
#box label{display:flex;justify-content:space-between;align-items:center;gap:8px}
#st{position:absolute;left:10px;bottom:8px;font-size:11px;opacity:.8;pointer-events:none;text-shadow:0 1px 3px #000}
@media(max-width:820px){body{grid-template:48px 1fr 150px/56px 1fr}aside{grid-column:1/3;flex-direction:row;flex-wrap:wrap}}
</style></head><body>
<header class="glass">
<button id="bNew">New</button><button id="bOpen">Open</button><button id="bImp">Import</button><button id="bSave">Save</button><button id="bExp">Export</button><span class="sep"></span>
<button id="bUndo">↶ Undo</button><button id="bRedo">↷ Redo</button><span class="sep"></span>
<button id="bCut">Cut</button><button id="bCopy">Copy</button><button id="bPaste">Paste</button><button id="bClr">Clear</button><button id="bAll">Sel All</button><button id="bDes">Deselect</button><span class="sep"></span>
<button id="bSize">Canvas…</button><button id="bFlt">Filter…</button><span class="sep"></span>
<button id="zo">−</button><button id="zv">100%</button><button id="zi">+</button><button id="zf">Fit</button>
<select id="sym" title="Symmetry ruler"><option value="off">Symmetry: off</option><option value="v">Mirror ↔</option><option value="h">Mirror ↕</option><option value="q">Quad</option><option value="k6">Kaleidoscope 6</option><option value="k8">Kaleidoscope 8</option></select>
<input type="file" id="fOpen" accept=".json,.inkboard" hidden><input type="file" id="fImp" accept="image/*" hidden>
</header>
<nav id="tools" class="glass"></nav>
<main id="stage"><div id="wrap"><canvas id="cv"></canvas><canvas id="ov"></canvas></div><div id="st"></div></main>
<aside class="glass">
<h4>Color</h4><canvas id="sv" width="240" height="120"></canvas><input type="range" id="hue" min="0" max="359">
<div class="row"><input type="text" id="hex" size="8"><button id="swap">⇄</button><div class="sw" id="fgS" style="width:30px;height:24px"></div><div class="sw" id="bgS" style="width:30px;height:24px"></div></div>
<div id="hist"></div><div id="pal"></div>
<h4>Brush</h4><select id="bsel"></select>
<div class="row">Size<input type="range" id="size" min="1" max="200" value="12"><b id="sizeV">12</b></div>
<div class="row">Opacity<input type="range" id="opac" min="1" max="100" value="100"><b id="opacV">100</b></div>
<div class="row">Stabilizer<input type="range" id="stab" min="0" max="10" value="3"></div>
<div class="row"><label><input type="checkbox" id="fill"> Fill shapes</label><label>Tol<input type="number" id="tol" value="24" min="0" max="255" style="width:50px"></label></div>
<h4>Layers</h4>
<div class="row"><button id="lAdd">+ Add</button><button id="lDup">Dup</button><button id="lDel">Delete</button><button id="lMrg">Merge ↓</button></div>
<div class="row"><button id="lClip">Clip</button><button id="lAl">α Lock</button><button id="lClr">Clear</button><button id="lExp">PNG</button></div>
<div class="row">Opacity<input type="range" id="lop" min="0" max="100" value="100"></div>
<select id="lbl"></select>
<div id="layers"></div>
</aside>
<div id="modal"><div id="box" class="glass"></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s),mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c},X=c=>c.getContext('2d',{willReadFrequently:true});
let W=1280,H=720,layers=[],cur=0,paper='#ffffff',paperOn=true,fg='#000000',bg='#ffffff',tool='brush',sel=null,view={x:0,y:0,z:1},uid=1,hsv=[0,0,0],sym='off',clipb=null;
const brush={name:'Dip Pen',size:12,op:1,stab:3};
const BL={'Normal':'source-over','Multiply':'multiply','Screen':'screen','Overlay':'overlay','Darken':'darken','Lighten':'lighten','Color Dodge':'color-dodge','Color Burn':'color-burn','Hard Light':'hard-light','Soft Light':'soft-light','Difference':'difference','Exclusion':'exclusion','Add':'lighter','Hue':'hue','Saturation':'saturation','Color':'color','Luminosity':'luminosity'};
const BR={'Dip Pen':{h:.95,sp:.08,fl:1,pz:1},'Felt Tip Pen':{h:.7,sp:.08,fl:.9,pz:.5},'Pencil':{h:.55,sp:.12,fl:.45,tex:1,pz:1,po:1},'Airbrush':{h:0,sp:.1,fl:.1},'Watercolor':{h:.25,sp:.18,fl:.07,jit:.25},'Marker':{h:1,sp:.06,fl:1,sq:1},'Chalk':{h:.8,sp:.2,fl:.6,tex:1,scat:.25},'Charcoal':{h:.5,sp:.15,fl:.5,tex:1,scat:.2,pz:1},'Crayon':{h:.7,sp:.15,fl:.7,tex:1},'Splatter':{h:.9,sp:1.2,fl:1,scat:1.2,jit:.8},'Star Stamp':{h:1,sp:1.1,fl:1,shape:'star',rot:1},'Heart Stamp':{h:1,sp:1.1,fl:1,shape:'heart'},'Neon':{h:.2,sp:.08,fl:.25}};
const TL=[['brush','Brush','B'],['eraser','Eraser','E'],['smudge','Smudge','S'],['fill','Bucket','G'],['pick','Pick','I'],['line','Line','L'],['rect','Rect','R'],['oval','Oval','O'],['grad','Gradient','D'],['text','Text','T'],['select','Select','M'],['move','Move','V'],['hand','Hand','H']];
/* ---------- history ---------- */
const U=[],R=[];let saveT;
const clone=c=>{const n=mk(c.width,c.height);X(n).drawImage(c,0,0);return n};
const meta=l=>({name:l.name,vis:l.vis,op:l.op,bl:l.bl,lock:l.lock,al:l.al,clip:l.clip});
const snap=()=>({w:W,h:H,cur,items:layers.map(l=>({l,m:meta(l),c:l.c}))});
function restore(s){W=s.w;H=s.h;layers=s.items.map(i=>(Object.assign(i.l,i.m),i.l.c=i.c,i.l));cur=Math.min(s.cur,layers.length-1);sizeWrap();ui()}
function hs(e){U.push(e);if(U.length>60)U.shift();R.length=0;btns();autosave()}
function sOp(f){const b=snap();f();hs({t:'s',b,a:snap()});ui()}
function pOp(l,b){hs({t:'p',l,b})}
function put(c,src){const x=X(c);x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='copy';x.globalAlpha=1;x.drawImage(src,0,0);x.restore()}
function undo(){const e=U.pop();if(!e)return;if(e.t==='p'){e.a=clone(e.l.c);put(e.l.c,e.b)}else restore(e.b);R.push(e);ui()}
function redo(){const e=R.pop();if(!e)return;if(e.t==='p')put(e.l.c,e.a);else restore(e.a);U.push(e);ui()}
function btns(){$('#bUndo').disabled=!U.length;$('#bRedo').disabled=!R.length}
/* ---------- layers / render ---------- */
function newLayer(n){return{id:uid++,name:n||'Layer '+uid,c:mk(W,H),vis:true,op:1,bl:'source-over',lock:false,al:false,clip:false}}
let sc=null,scOp=1,live=null,rq=0;
const render=()=>{rq||(rq=requestAnimationFrame(()=>{rq=0;draw()}))};
function draw(){const cv=$('#cv'),x=cv.getContext('2d');x.clearRect(0,0,W,H);if(paperOn){x.fillStyle=paper;x.fillRect(0,0,W,H)}
let base=null;layers.forEach((l,i)=>{if(!l.vis)return;let src=l.c;
if(i===cur&&sc){const t=mk(W,H),tx=X(t);tx.drawImage(l.c,0,0);tx.globalAlpha=scOp;if(l.al)tx.globalCompositeOperation='source-atop';tx.drawImage(sc,0,0);src=t}
if(l.clip&&base){const t=mk(W,H),tx=X(t);tx.drawImage(src,0,0);tx.globalCompositeOperation='destination-in';tx.drawImage(base.c,0,0);src=t}else if(!l.clip)base=l;
x.globalAlpha=l.op;x.globalCompositeOperation=l.bl;x.drawImage(src,0,0)});x.globalAlpha=1;x.globalCompositeOperation='source-over';overlay()}
function overlay(extra){const o=$('#ov'),x=o.getContext('2d');x.clearRect(0,0,W,H);const z=view.z;x.lineWidth=1/z;x.setLineDash([5/z,4/z]);
if(sel){x.strokeStyle='#fff';x.strokeRect(sel.x,sel.y,sel.w,sel.h);x.strokeStyle='#000';x.lineDashOffset=5/z;x.strokeRect(sel.x,sel.y,sel.w,sel.h)}
if(sym!=='off'){x.strokeStyle='rgba(91,140,255,.8)';x.beginPath();if(sym==='v'||sym==='q'){x.moveTo(W/2,0);x.lineTo(W/2,H)}if(sym==='h'||sym==='q'){x.moveTo(0,H/2);x.lineTo(W,H/2)}x.stroke()}
if(extra)extra(x)}
function thumbs(){document.querySelectorAll('.ly canvas').forEach((c,i)=>{const l=layers[layers.length-1-i],x=c.getContext('2d');x.clearRect(0,0,40,28);x.drawImage(l.c,0,0,40,28)})}
let thT;function ui(){const L=$('#layers');L.innerHTML='';for(let i=layers.length-1;i>=0;i--){const l=layers[i],d=document.createElement('div');d.className='ly'+(i===cur?' cur':'');d.draggable=true;
d.innerHTML='<button class="v">'+(l.vis?'👁':'–')+'</button><canvas width="40" height="28"></canvas><span></span><button class="k">'+(l.lock?'🔒':'·')+'</button>';d.querySelector('span').textContent=l.name+(l.clip?' ⤵':'')+(l.al?' α':'');
d.onclick=e=>{if(e.target.closest('button'))return;cur=i;ui()};
d.querySelector('.v').onclick=()=>sOp(()=>l.vis=!l.vis);d.querySelector('.k').onclick=()=>sOp(()=>l.lock=!l.lock);
d.querySelector('span').ondblclick=()=>{const n=prompt('Layer name',l.name);if(n)sOp(()=>l.name=n)};
d.ondragstart=e=>e.dataTransfer.setData('t',i);d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();const f=+e.dataTransfer.getData('t');if(f===i)return;sOp(()=>{const[m]=layers.splice(f,1),cl=layers[cur]===undefined?null:null;layers.splice(i,0,m);cur=i})};L.appendChild(d)}
const l=layers[cur];if(l){$('#lop').value=l.op*100;$('#lbl').value=Object.keys(BL).find(k=>BL[k]===l.bl);$('#lClip').classList.toggle('on',l.clip);$('#lAl').classList.toggle('on',l.al)}
btns();render();clearTimeout(thT);thT=setTimeout(thumbs,30)}
/* ---------- view ---------- */
function sizeWrap(){const w=$('#wrap');w.style.width=W+'px';w.style.height=H+'px';for(const id of['cv','ov']){const c=$('#'+id);if(c.width!==W||c.height!==H){c.width=W;c.height=H}}applyView()}
function applyView(){$('#wrap').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`;$('#zv').textContent=Math.round(view.z*100)+'%';$('#cv').style.imageRendering=view.z>3?'pixelated':'auto';overlay()}
function fit(){const s=$('#stage');view.z=Math.min((s.clientWidth-40)/W,(s.clientHeight-40)/H);view.x=(s.clientWidth-W*view.z)/2;view.y=(s.clientHeight-H*view.z)/2;applyView()}
function zoomAt(f,cx,cy){const s=$('#stage').getBoundingClientRect();cx=cx??s.left+s.width/2;cy=cy??s.top+s.height/2;const px=cx-s.left,py=cy-s.top,nz=Math.max(.05,Math.min(32,view.z*f));view.x=px-(px-view.x)*nz/view.z;view.y=py-(py-view.y)*nz/view.z;view.z=nz;applyView()}
const pt=e=>{const r=$('#cv').getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height,p:e.pointerType==='pen'&&e.pressure>0?e.pressure:1}};
/* ---------- color ---------- */
const h2r=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function hsv2hex(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return'#'+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function hex2hsv(hex){const[r,g,b]=h2r(hex).map(x=>x/255),m=Math.max(r,g,b),d=m-Math.min(r,g,b);let h=d===0?0:m===r?((g-b)/d+6)%6:m===g?(b-r)/d+2:(r-g)/d+4;return[h*60,m?d/m:0,m]}
function setFg(hex,hist=true){fg=hex;hsv=hex2hsv(hex);$('#fgS').style.background=fg;$('#hex').value=fg;$('#hue').value=hsv[0];svDraw();if(hist){const H=$('#hist');const s=mkSw(hex);H.prepend(s);while(H.children.length>14)H.lastChild.remove()}}
const mkSw=c=>{const s=document.createElement('div');s.className='sw';s.style.background=c;s.onclick=()=>setFg(c,false);return s};
function svDraw(){const c=$('#sv'),x=c.getContext('2d');x.fillStyle=hsv2hex(hsv[0],1,1);x.fillRect(0,0,240,120);let g=x.createLinearGradient(0,0,240,0);g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,240,120);g=x.createLinearGradient(0,0,0,120);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,240,120);x.strokeStyle='#fff';x.beginPath();x.arc(hsv[1]*240,(1-hsv[2])*120,5,0,7);x.stroke()}
/* ---------- brush engine ---------- */
const tips=new Map();
function tip(p,size,color,v){const s=Math.max(2,Math.ceil(size)),k=[brush.name,s,color,v].join('|');if(tips.has(k))return tips.get(k);const c=mk(s,s),x=c.getContext('2d'),r=s/2;x.fillStyle=color;
if(p.shape==='star'){x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.42:r;x.lineTo(r+Math.cos(a)*rr,r+Math.sin(a)*rr)}x.fill()}
else if(p.shape==='heart'){x.translate(r,r*.9);x.scale(r/16,r/16);x.beginPath();x.moveTo(0,-4);x.bezierCurveTo(0,-14,-16,-12,-16,-2);x.bezierCurveTo(-16,8,-4,12,0,18);x.bezierCurveTo(4,12,16,8,16,-2);x.bezierCurveTo(16,-12,0,-14,0,-4);x.fill()}
else if(p.sq){x.fillRect(s*.1,s*.1,s*.8,s*.8)}
else{const g=x.createRadialGradient(r,r,0,r,r,r);g.addColorStop(0,color);g.addColorStop(Math.max(0,Math.min(.99,p.h)),color);const[a,b,cc]=h2r(color);g.addColorStop(1,`rgba(${a},${b},${cc},0)`);x.fillStyle=g;x.fillRect(0,0,s,s)}
if(p.tex){const im=x.getImageData(0,0,s,s),d=im.data;for(let i=3;i<d.length;i+=4)d[i]*=Math.random()<.55?Math.random():1;x.putImageData(im,0,0)}
if(tips.size>400)tips.clear();tips.set(k,c);return c}
function symPts(x,y){if(sym==='off')return[[x,y,0]];const o=[[x,y,0]];if(sym==='v'||sym==='q')o.push([W-x,y,1]);if(sym==='h'||sym==='q')o.push([x,H-y,1]);if(sym==='q')o.push([W-x,H-y,0]);
if(sym[0]==='k'){const n=+sym.slice(1),cx=W/2,cy=H/2,dx=x-cx,dy=y-cy;o.length=0;for(let i=0;i<n;i++){const a=i*2*Math.PI/n,c=Math.cos(a),s=Math.sin(a);o.push([cx+dx*c-dy*s,cy+dx*s+dy*c,0])}}return o}
let S=null;
function stamp(ctx,x,y,pr,erase){const p=BR[brush.name];let sz=brush.size*(p.pz?.25+.75*pr:1);if(p.jit)sz*=1-Math.random()*p.jit;const col=erase?'#000':fg,t=tip(p,sz,col,p.tex?(Math.random()*4|0):0),s=t.width;
let fl=p.fl*(p.po?.4+.6*pr:1);if(erase)fl=1;const spr=p.scat?sz*p.scat:0;for(const[sx,sy]of symPts(x,y)){const px=sx+(spr?(Math.random()-.5)*spr*2:0),py=sy+(spr?(Math.random()-.5)*spr*2:0);ctx.globalAlpha=fl;if(p.rot||sym[0]==='k'){ctx.save();ctx.translate(px,py);ctx.rotate(p.rot?Math.random()*6.28:0);ctx.drawImage(t,-s/2,-s/2);ctx.restore()}else ctx.drawImage(t,px-s/2,py-s/2)}ctx.globalAlpha=1}
function strokeTo(ctx,a,b,erase,smudge){const p=BR[brush.name],sp=Math.max(1,brush.size*p.sp),dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);let n=Math.max(1,Math.floor((d+S.rem)/sp)),t0=sp-S.rem;
for(let k=0;k<n;k++){const tt=d?Math.min(1,(t0+k*sp)/d):1;if(tt<0)continue;const x=a.x+dx*tt,y=a.y+dy*tt,pr=a.p+(b.p-a.p)*tt;if(smudge)smudgeAt(ctx,S.sx,S.sy,x,y);else stamp(ctx,x,y,pr,erase);S.sx=x;S.sy=y}S.rem=((d+S.rem)%sp)}
function smudgeAt(ctx,x0,y0,x,y){const s=Math.max(4,brush.size);const r=s/2;ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();ctx.globalAlpha=.55;ctx.drawImage(S.base,x0-r,y0-r,s,s,x-r,y-r,s,s);ctx.restore()}
/* ---------- pointer tools ---------- */
let drag=null,space=false;
const stage=$('#stage');
const locked=()=>{const l=layers[cur];if(!l){return true}if(!l.vis){note('Layer is hidden');return true}if(l.lock){note('Layer is locked');return true}return false};
const note=t=>{$('#st').textContent=t;clearTimeout(note.t);note.t=setTimeout(()=>$('#st').textContent='',2000)};
function clipSel(x){if(sel){x.beginPath();x.rect(sel.x,sel.y,sel.w,sel.h);x.clip()}}
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);const P=pt(e),l=layers[cur];
if(e.button===1||space||tool==='hand'){drag={k:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};return}
if(e.button!==0&&e.pointerType==='mouse')return;
if(tool==='pick'){const d=$('#cv').getContext('2d').getImageData(Math.max(0,Math.min(W-1,P.x|0)),Math.max(0,Math.min(H-1,P.y|0)),1,1).data;setFg('#'+[...d.slice(0,3)].map(v=>v.toString(16).padStart(2,'0')).join(''));return}
if(tool==='select'){drag={k:'sel',a:P};sel=null;return}
